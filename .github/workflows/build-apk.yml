name: Build FACE LAB APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        run: unzip -q FaceLabAI_PROPLUS_22_Android_Source.zip -d source

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable APK
        working-directory: source/FaceLabAI_Android_22
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp source/FaceLabAI_Android_22/app/build/outputs/apk/debug/app-debug.apk FACE-LAB-PROPLUS-22-TEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FACE-LAB-PROPLUS-22-ANDROID-TEST
          path: FACE-LAB-PROPLUS-22-TEST.apk
          if-no-files-found: error
