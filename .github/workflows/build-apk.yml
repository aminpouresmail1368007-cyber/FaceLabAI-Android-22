name: Build FACE LAB 23.0 APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source
        run: unzip -q FaceLabAI_PROPLUS_23_0_CLINICAL_3D_SCAN_SOURCE.zip -d source

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: source/FaceLabAI_Android_23_0
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp source/FaceLabAI_Android_23_0/app/build/outputs/apk/debug/app-debug.apk \
          FACE-LAB-PROPLUS-23.0-CLINICAL-3D-SCAN.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FACE-LAB-PROPLUS-23.0-CLINICAL-3D-SCAN
          path: FACE-LAB-PROPLUS-23.0-CLINICAL-3D-SCAN.apk
          if-no-files-found: error
